<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Fanny - Feliz Día de las Madres</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at top, #13081f, #04020a 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: Georgia, serif;
      overflow-x: hidden;
      padding: 14px;
    }

    #wrap {
      background: #07040f;
      border-radius: 24px;
      width: 100%;
      max-width: 820px;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 0 60px rgba(180, 80, 255, 0.12),
        0 0 120px rgba(255, 80, 140, 0.08);
      animation: fadeIn 1.6s ease;
      border: 1px solid rgba(255,255,255,0.04);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    canvas {
      display: block;
      width: 100%;
    }

    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #header {
      text-align: center;
      padding: 24px 20px 0;
    }

    #header h1 {
      font-size: 30px;
      font-weight: 400;
      color: #ffd6e8;
      letter-spacing: 3px;
      text-shadow: 0 0 26px rgba(255,100,160,0.5);
      margin-bottom: 5px;
    }
</html>
